<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

        <h2>Empleados</h2>

      </div>

      <div class="form">

        <input class="inputNormal" type="number" placeholder="Primer Nombre" >
        <input class="inputNormal" type="number" placeholder="Segundo Nombre" >
        <input class="inputNormal" type="number" placeholder="Primer Apellido" >
        <input class="inputNormal" type="number" placeholder="Segundo Apellido" >

          <button class="buttonForm confirmar" >CONFIRMAR</button>
          <button class="buttonForm limpiar" id="limpiar" >LIMPIAR</button>
        </div>

      </div>


    </div>



    <div class="tabla">

      <table>
        <tr class="columnTable">
          <th>Codigo Empleado</th>
          <th>Identidad</th>
          <th>Primer Nombre</th>
          <th>Segundo Nombre</th>
          <th>Primer Apellido</th>
          <th>Segundo Apellido</th>
          <th>Acciones</th>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td>
            <button class="headerButton"><img src="assets/lapiz.png" alt="" class="buttonIcon"></button>
            <button class="headerButton"><img src="assets/basura%20(2).png" alt="" class="buttonIcon"></button>
          </td>

        </tr>
      </table>


    </div>


  </div>

</div>
